name: Desplegar avisos de Comedor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - worker-push.js
      - .github/workflows/deploy-push.yml
permissions:
  contents: read
concurrency:
  group: comedor-push-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publicar servicio de avisos
        run: npx --yes wrangler@4 deploy worker-push.js --name svpaulcar-comedor-push --compatibility-date 2026-11-06
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cdd91f774a9320d0e412fb88ae107850
